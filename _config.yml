# ============================================================
# Halcyon Theme Configuration
# ============================================================

# Favicon (relative to theme source directory)
favicon: /images/favicon.png

# Site brand text shown in header (fallback to site title)
site_brand: SkyのXnok
# Site subtitle shown in header (fallback to site title)
subtitle: 成为更好的自己
# Site build time (for running time calculation)
buildtime: 2026-06-01
# Navigation menu
menu:
  home: / || house
  posts: 
    default: / || pen
    archives: /archives || archive
    categories: /categories || chart
    tags: /tags || tag
  friends: /friends || feather
  links: /links || plane
  about: /about || id

# Header background images (Ken Burns crossfade slideshow)
header_images:
  - https://tva1.sinaimg.cn/large/6833939bly1giclga70tsj20zk0m84mr.jpg
  - https://tva1.sinaimg.cn/large/6833939bly1giclfb3vzhj20zk0m8wny.jpg
  - https://tva1.sinaimg.cn/large/6833939bly1giclil3m4ej20zk0m8tn8.jpg
  - https://tva1.sinaimg.cn/large/6833939bly1gipewkhf1zj20zk0m81kx.jpg
  - https://tva1.sinaimg.cn/large/6833939bly1giclxfdlttj20zk0m8npd.jpg
  - https://tva1.sinaimg.cn/large/6833939bly1gipeybxm1pj20zk0m8niv.jpg

# Social links (shown in sidebar)
social:
  GitHub: https://github.com/
  Twitter: https://twitter.com/

# Sidebar widgets (order matters)
# Available: categories, tags, archives, recent_posts, tagcloud
widgets:
  - categories
  - tags
  - archives
  - recent_posts

# Show post count next to categories/tags/archives
show_count: true

# Number of recent posts to show in sidebar
recent_posts_limits: 5

# Theme accent colors
colors:
  accent: "#6c5ce7"
  accent_hover: "#5a4bd1"

# Code syntax highlighting theme
highlight:
  theme: default
# Sakura configuration
sakura:
  enable: true
  switchable: true
  sakuraNum: 15
  limitTimes: -1
  size:
    min: 1
    max: 1.5
  opacity:
    min: 0.1
    max: 0.9
  speed:
    horizontal:
      min: -1.7
      max: -1.2
    vertical:
      min: 1.5
      max: 2.2
    rotation: 0.01
    fadeSpeed: 0.01
  zIndex: 100
