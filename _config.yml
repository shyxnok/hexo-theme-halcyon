# ============================================================
# Halcyon Theme Configuration
# ============================================================

# Favicon (relative to theme source directory)
favicon: /images/favicon.png

# Site brand text shown in header (fallback to site title)
site_brand: SkyのXnok
# Site subtitle shown in header (fallback to site title)
subtitle: 成为更好的自己
# Site build time (for running time calculation)
buildtime: 2026-06-01
# Navigation menu
menu:
  home: / || house
  posts: 
    default: / || pen
    archives: /archives || archive
    categories: /categories || chart
    tags: /tags || tag
  friends: /friends || feather
  links: /links || plane
  about: /about || id

# Header background images (Ken Burns crossfade slideshow)
image:
  host: https://pic.201562.xyz/background/
  header_images:
    - 98970aaa7f3888d179e314a306f4d74f.jpg
    - d3dd2a132bba649a1b3e5df20b09bfa5.jpg
    - 7846ffa7419f62c2a693cd808e442caa.jpg
    - 2933dcb72f64d1316701ef525a5b2b8c.jpg
    - d25b0a6f721cba7dad4d4bb98d1925ea.jpg
    - 40f78271a50ac65f15de7f4466a17ca6.jpg
  random_url: https://pic.201562.xyz/random?url=background
# Social links (shown in sidebar)
social:
  GitHub: https://github.com/
  Twitter: https://twitter.com/

# Sidebar widgets (order matters)
# Available: categories, tags, archives, recent_posts, tagcloud
widgets:
  - categories
  - tags
  - archives
  - recent_posts

# Show post count next to categories/tags/archives
show_count: true

# Number of recent posts to show in sidebar
recent_posts_limits: 5

# Theme accent colors
colors:
  accent: "#6c5ce7"
  accent_hover: "#5a4bd1"

# Code syntax highlighting theme
highlight:
  theme: default
# Sakura configuration
sakura:
  enable: true
  switchable: true
  sakuraNum: 15
  limitTimes: -1
  size:
    min: 1
    max: 1.5
  opacity:
    min: 0.1
    max: 0.9
  speed:
    horizontal:
      min: -1.7
      max: -1.2
    vertical:
      min: 1.5
      max: 2.2
    rotation: 0.01
    fadeSpeed: 0.01
  zIndex: 100
